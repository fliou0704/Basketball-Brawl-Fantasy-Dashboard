name: League Data and Pages

on:
  schedule:
    - cron: '17 */3 * 1-6,10-12 *'
    - cron: '17 13 * 7-9 *'
  workflow_dispatch:

permissions:
  contents: write

# Shared with frontend-pages.yml: serialize source updates and Pages builds.
concurrency:
  group: basketball-brawl-pages
  cancel-in-progress: false

jobs:
  update-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      deploy: ${{ steps.exports.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/checkout@v4
        with:
          ref: codex
          path: site
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            site/requirements.txt
            site/frontend/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/frontend/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r site/requirements.txt -r site/frontend/requirements-build.txt
          npm ci --prefix site/frontend
      - name: Offline safety tests
        working-directory: site
        run: python -m unittest discover -s tests -v
      - name: Seed existing metadata until it is canonical on main
        run: |
          if [ ! -f data/playerMetadata.csv ]; then
            cp site/data/playerMetadata.csv data/playerMetadata.csv
          fi
      - name: Stage and validate bounded ESPN updates
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python site/nearLiveUpdater.py --data-dir data --write
      - name: Regenerate frontend payloads
        run: python site/frontend/scripts/generate_all.py --source-dir data --output-dir site/frontend/public/data
      - name: Test generated data
        working-directory: site
        env:
          BRAWL_REFERENCE_DIR: ${{ github.workspace }}/data
          H2H_TEST_SOURCE: ${{ github.workspace }}/data
          RECORD_BOOK_TEST_SOURCE: ${{ github.workspace }}/data
          TEAM_STATS_TEST_SOURCE: ${{ github.workspace }}/data
          HOMEPAGE_TEST_SOURCE: ${{ github.workspace }}/data
          STANDINGS_TEST_SOURCE: ${{ github.workspace }}/data/basketballBrawlLeagueData.csv
        run: |
          python -m unittest discover -s frontend/scripts -p 'test_*.py' -v
          npm test --prefix frontend
      - name: Compare exports with deployed Pages
        id: exports
        run: python site/frontend/scripts/export_fingerprint.py --data-dir site/frontend/public/data --deployed-url https://fliou0704.github.io/Basketball-Brawl-Fantasy-Dashboard/data/pipeline.json >> "$GITHUB_OUTPUT"
      - name: Build changed Pages payload
        if: steps.exports.outputs.changed == 'true'
        run: npm run build --prefix site/frontend
      - name: Commit validated canonical inputs
        run: |
          for file in basketballBrawlLeagueData.csv playerMatchupData.csv playerDailyData.csv activityData.csv playerMetadata.csv scoringPeriodMatchupMap.csv seasonMetadata.json currentLeague.json; do
            if [ -f "data/$file" ]; then git add "data/$file"; fi
          done
          if ! git diff --cached --quiet; then
            git config user.name github-actions
            git config user.email actions@github.com
            git commit -m "Refresh league data and recent ESPN corrections"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.exports.outputs.changed == 'true'
        with:
          path: site/frontend/dist
      - name: Run summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          DEPLOY: ${{ steps.exports.outputs.changed }}
        run: |
          echo "Update status: $JOB_STATUS; changed Pages payload: ${DEPLOY:-not reached}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: update-data
    if: needs.update-data.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
