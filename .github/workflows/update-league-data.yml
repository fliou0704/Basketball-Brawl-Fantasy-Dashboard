name: Weekly League Data Update

on:
  schedule:
    - cron: "0 13 * * 3"   # Wednesdays 9am ET
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Run data updaters
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: |
          python dataUpdater.py

      - name: Validate updated data
        run: >-
          python -c "import pandas as pd; from dataUpdateSafety import validate_league_data, validate_player_matchup_data; validate_league_data(pd.read_csv('data/basketballBrawlLeagueData.csv')); validate_player_matchup_data(pd.read_csv('data/playerMatchupData.csv')); print('Updated CSV validation passed.')"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/*.csv
          git commit -m "Weekly league data update" || echo "No changes to commit"
          git push
