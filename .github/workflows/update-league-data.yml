name: Weekly League Data Update

on:
  schedule:
    - cron: "0 13 * * 3"   # Wednesdays 9am ET
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Run data updaters
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: |
          python dataUpdater.py
          python activityDataUpdater.py --write
          # Re-run discovery after activity updates. Fresh profiles are cached,
          # so this only calls ESPN if activity introduced a new player ID.
          python playerMetadataUpdater.py

      - name: Validate updated data
        run: >-
          python -c "import pandas as pd; from activityDataUpdater import validate_activity; from dataUpdateSafety import validate_league_data, validate_player_matchup_data, validate_player_daily_data; from playerMetadataUpdater import discover_player_ids, validate_metadata; validate_league_data(pd.read_csv('data/basketballBrawlLeagueData.csv')); validate_player_matchup_data(pd.read_csv('data/playerMatchupData.csv')); validate_player_daily_data(pd.read_csv('data/playerDailyData.csv')); validate_activity(pd.read_csv('data/activityData.csv')); metadata=pd.read_csv('data/playerMetadata.csv'); discovered=discover_player_ids('data'); validate_metadata(metadata, discovered, discovered-set(pd.to_numeric(metadata['ESPN Player ID']).astype(int))); print('Updated CSV validation passed.')"

      - name: Check for data changes
        id: changes
        run: |
          if git diff --quiet -- data/*.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/*.csv
          git commit -m "Weekly league data update"
          git push

      # Build codex here because GITHUB_TOKEN data pushes do not start the
      # push-triggered Pages workflow.
      - name: Checkout codex frontend
        if: steps.changes.outputs.changed == 'true'
        uses: actions/checkout@v4
        with:
          ref: codex
          path: site
          persist-credentials: false

      - name: Set up Node
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.changed == 'true'
        run: |
          pip install -r site/frontend/requirements-build.txt
          npm ci --prefix site/frontend

      - name: Regenerate and test all frontend data
        if: steps.changes.outputs.changed == 'true'
        env:
          H2H_TEST_SOURCE: data
          RECORD_BOOK_TEST_SOURCE: data
          TEAM_STATS_TEST_SOURCE: data
          HOMEPAGE_TEST_SOURCE: data
          STANDINGS_TEST_SOURCE: data/basketballBrawlLeagueData.csv
        run: |
          python site/frontend/scripts/generate_all.py --source-dir data --output-dir site/frontend/public/data
          python -m unittest discover -s site/frontend/scripts -p 'test_*.py' -v
          npm test --prefix site/frontend

      - name: Build frontend
        if: steps.changes.outputs.changed == 'true'
        run: npm run build --prefix site/frontend

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/frontend/dist

  deploy:
    needs: update-data
    if: needs.update-data.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
