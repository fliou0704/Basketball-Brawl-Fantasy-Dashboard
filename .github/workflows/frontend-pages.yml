name: Frontend prototype Pages

on:
  push:
    branches: [codex]
    paths:
      - 'frontend/**'
      - 'data/basketballBrawlLeagueData.csv'
      - 'data/playerDailyData.csv'
      - 'data/playerMatchupData.csv'
      - 'data/activityData.csv'
      - 'data/playerMetadata.csv'
      - 'dataStore.py'
      - 'assets/logos/**'
      - 'assets/placements/**'
      - '.github/workflows/frontend-pages.yml'

permissions:
  contents: read

concurrency:
  group: frontend-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/codex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The scheduled updater owns production CSVs on main. Build the codex
      # frontend against that freshly committed source snapshot.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: frontend/.league-source
          sparse-checkout: |
            data/basketballBrawlLeagueData.csv
            data/playerDailyData.csv
            data/playerMatchupData.csv
            data/activityData.csv
            data/playerMetadata.csv
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Use codex metadata until the updater is merged to main
        run: |
          if [ ! -f frontend/.league-source/data/playerMetadata.csv ]; then
            cp data/playerMetadata.csv frontend/.league-source/data/playerMetadata.csv
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r frontend/requirements-build.txt
      - run: npm ci
        working-directory: frontend
      - run: python frontend/scripts/generate_all.py --source-dir frontend/.league-source/data
      - run: python -m unittest discover -s frontend/scripts -p 'test_*.py' -v
        env:
          H2H_TEST_SOURCE: frontend/.league-source/data
          RECORD_BOOK_TEST_SOURCE: frontend/.league-source/data
          TEAM_STATS_TEST_SOURCE: frontend/.league-source/data
          HOMEPAGE_TEST_SOURCE: frontend/.league-source/data
          STANDINGS_TEST_SOURCE: frontend/.league-source/data/basketballBrawlLeagueData.csv
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
