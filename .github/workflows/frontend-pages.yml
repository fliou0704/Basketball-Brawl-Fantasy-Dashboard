name: Frontend prototype Pages

on:
  push:
    branches: [codex]
    paths:
      - 'frontend/**'
      - 'data/basketballBrawlLeagueData.csv'
      - 'dataStore.py'
      - 'assets/logos/**'
      - '.github/workflows/frontend-pages.yml'

permissions:
  contents: read

concurrency:
  group: frontend-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/codex'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
        working-directory: frontend
      - run: python frontend/scripts/generate_standings.py
      - run: python -m unittest discover -s frontend/scripts -p 'test_*.py' -v
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
